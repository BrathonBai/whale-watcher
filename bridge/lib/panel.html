<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鲸鲸桥 · 面板</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,"Segoe UI",system-ui,sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .meta { color:var(--dim); font-size:12px; margin-left:auto; display:flex; gap:14px; }
  main { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px,1fr)); gap:14px; padding:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin:0 0 10px; font-weight:600; }
  .faces { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  button { background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--acc); color:var(--acc); }
  button:active { transform:translateY(1px); }
  button[disabled] { opacity:.45; cursor:not-allowed; }
  input[type=text], textarea { width:100%; background:#0d1117; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  textarea { height:120px; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row > * { flex:1; }
  ul { list-style:none; margin:0; padding:0; max-height:260px; overflow:auto; font-size:12px; font-family:ui-monospace,Consolas,monospace; }
  li { padding:4px 0; border-bottom:1px dashed #21262d; color:var(--dim); }
  li b { color:var(--fg); font-weight:500; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .kv { font-size:12px; color:var(--dim); font-family:ui-monospace,Consolas,monospace; }
  .kv b { color:var(--fg); font-weight:500; }
  #shot-img { width:100%; border-radius:8px; margin-top:8px; display:none; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>鲸鲸桥 · v2 契约</h1>
  <div class="meta">
    <span id="m-fw">—</span>
    <span id="m-brain">—</span>
    <span id="m-uptime">—</span>
    <span id="m-seq">—</span>
  </div>
</header>

<main>
  <section>
    <h2>表情 / 动作</h2>
    <div class="faces" id="faces"></div>
    <p class="kv" style="margin:10px 0 0">
      v2 只有三段素材：<b>idle</b>=待机 · <b>look</b>=倾听/张望 · <b>wave</b>=讲述/兴奋<br>
      所以 happy→wave、sad→idle（映射与固件 render.cc 的 PetClipFor 一致）
    </p>
  </section>

  <section>
    <h2>说话 / 拍照</h2>
    <input id="say" type="text" placeholder="输入一句话，回车发送（同时念出来）">
    <div class="row">
      <button id="btn-say">发送</button>
      <button id="btn-shot">拍一张</button>
    </div>
    <img id="shot-img" alt="最近一张照片">
    <p class="kv" style="margin:10px 0 0" id="tts-hint">—</p>
  </section>

  <section>
    <h2>设备能力（契约）</h2>
    <div class="kv" id="caps">—</div>
  </section>

  <section>
    <h2>最近上行事件</h2>
    <ul id="events"><li>（等设备上行）</li></ul>
  </section>

  <section>
    <h2>配置（改完立即生效）</h2>
    <textarea id="cfg" spellcheck="false"></textarea>
    <div class="row">
      <button id="btn-cfg">保存</button>
      <button id="btn-refresh">刷新状态</button>
    </div>
  </section>
</main>

<script>
const MOODS = ['idle','blink','listen','think','speak','happy','sad','error'];
const $ = (id) => document.getElementById(id);
const api = (p, opt) => fetch(p, opt).then(r => r.json()).catch(e => ({ ok:false, error:String(e) }));

function renderFaces() {
  $('faces').innerHTML = MOODS.map(m => `<button data-mood="${m}">${m}</button>`).join('');
  $('faces').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    api('/api/face', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ mood: b.dataset.mood }) });
  };
}

let lastSeq = 0, lastImage = '';
async function tick() {
  const s = await api('/health');
  if (s && s.ok) {
    $('dot').className = 'dot' + (s.device.online ? ' on' : '');
    $('m-fw').textContent = `fw ${s.device.version?.fw || '?'} / ver ${s.device.version?.ver || '?'}`;
    $('m-brain').textContent = `大脑 ${s.brain.mode}${s.brain.sessionId ? ' · ' + s.brain.sessionId.slice(-8) : ''}`;
    $('m-uptime').textContent = `在线 ${Math.round((s.device.connectedMs||0)/1000)}s`;
    $('m-seq').textContent = `事件 #${s.device.counters.seq}`;
    $('tts-hint').innerHTML = s.tts.configured
      ? `TTS：<b>${s.tts.engine}</b> 已配置${s.tts.on ? '' : '（tts=false，不出声）'}`
      : `<span class="bad">TTS 没配好</span>（engine=${s.tts.engine}，缺 key/音色 → 只亮屏不出声）`;
    const cap = s.capabilities || {};
    $('caps').innerHTML =
      `上行：<b>${(cap.uplink||[]).join(' / ')}</b><br>` +
      `下行：<b>${(cap.downlink||[]).join(' / ')}</b><br>` +
      `不具备：<b class="bad">${Object.keys(cap.unsupported||{}).join(' / ')}</b><br>` +
      `采集：<b>${s.device.collecting ? s.device.collecting.kind + ' ' + s.device.collecting.got + '/' + s.device.collecting.bytes : '空闲'}</b>`;
    const cur = s.config || {};
    if (document.activeElement !== $('cfg')) {
      $('cfg').value = JSON.stringify({
        brain: cur.brain, tts: cur.tts, ttsEngine: cur.ttsEngine, maxReplyChars: cur.maxReplyChars,
        filler: cur.filler, asr: cur.asr,
      }, null, 2);
    }
    const ev = await api(`/events?after=${lastSeq}&limit=30`);
    if (ev.ok && ev.events.length) {
      lastSeq = ev.seq;
      const ul = $('events');
      if (ul.dataset.fresh !== '1') { ul.innerHTML = ''; ul.dataset.fresh = '1'; }
      for (const e of ev.events.slice(-12)) {
        const li = document.createElement('li');
        li.innerHTML = `<b>${e.kind}</b> ${new Date(e.at).toLocaleTimeString()} ${JSON.stringify(e.msg).slice(0,90)}`;
        ul.prepend(li);
      }
      while (ul.children.length > 40) ul.lastChild.remove();
    }
  }
}

$('btn-say').onclick = async () => {
  const t = $('say').value.trim(); if (!t) return;
  await api('/say', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ text: t }) });
  $('say').value = '';
};
$('say').onkeydown = (e) => { if (e.key === 'Enter') $('btn-say').click(); };

$('btn-shot').onclick = async () => {
  const btn = $('btn-shot');
  btn.disabled = true; btn.textContent = '拍摄中…';
  const r = await api('/shot?timeoutMs=8000');
  btn.disabled = false; btn.textContent = '拍一张';
  if (r.ok) {
    lastImage = r.path;
    const img = $('shot-img');
    img.src = '/shot.jpg?t=' + Date.now();
    img.style.display = 'block';
  } else {
    alert('拍照失败：' + JSON.stringify(r.error || r));
  }
};

$('btn-cfg').onclick = async () => {
  let patch; try { patch = JSON.parse($('cfg').value); } catch (e) { return alert('不是合法 JSON'); }
  const r = await api('/api/config', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(patch) });
  alert(r.ok ? '保存好了' : ('失败：' + r.error));
};
$('btn-refresh').onclick = tick;

renderFaces(); tick(); setInterval(tick, 2500);
</script>
</body>
</html>
